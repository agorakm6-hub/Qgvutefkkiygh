<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crown Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#111113; --panel:#1c1c20; --panel2:#242429;
    --gold:#ffd35c; --text:#f0ede4; --text-dim:#9aa0ab;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0;}
  body{
    background:#101012; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  #wrap{ width:100%; max-width:360px; text-align:center; }
  #logo{ margin-bottom:6px; }
  #logo svg{ width:46px; height:46px; }
  .flag{ width:28px; height:20px; border-radius:3px; overflow:hidden; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,0.12); }
  h1{ font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:0.5px; }
  #sub{ font-size:14px; color:var(--text-dim); margin:0 0 26px; line-height:1.5; }
  .lang-btn{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--panel2); border:1px solid rgba(255,211,92,0.18);
    border-radius:14px; padding:14px 16px; margin-bottom:10px;
    color:var(--text); font-size:16px; font-weight:600;
    cursor:pointer; transition:transform .12s ease, border-color .12s ease;
  }
  .lang-btn:active{ transform:scale(0.97); border-color:var(--gold); }
  #spinner{ display:none; width:28px; height:28px; margin:30px auto 0;
    border:3px solid rgba(255,211,92,0.25); border-top-color:var(--gold);
    border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
</style>
</head>
<body>
  <div id="wrap">
    <div id="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff6d8"/><stop offset="100%" stop-color="#d9a521"/>
        </linearGradient></defs>
        <path fill="url(#crownGrad)" stroke="#a9791e" stroke-width="0.5" stroke-linejoin="round" d="M3 9.2l3.6 2.3L12 4.6l5.4 6.9 3.6-2.3-1.8 8.3H4.8L3 9.2z"/>
        <circle cx="3.3" cy="8.7" r="1.35" fill="#fff6d8" stroke="#a9791e" stroke-width="0.5"/>
        <circle cx="12" cy="4.3" r="1.35" fill="#fff6d8" stroke="#a9791e" stroke-width="0.5"/>
        <circle cx="20.7" cy="8.7" r="1.35" fill="#fff6d8" stroke="#a9791e" stroke-width="0.5"/>
        <rect x="4.5" y="17.3" width="15" height="2.5" rx="0.6" fill="url(#crownGrad)" stroke="#a9791e" stroke-width="0.5"/>
      </svg>
    </div>
    <h1>Выберите язык · Alegeți limba · Choose language</h1>
    <p id="sub">Это можно изменить позже в настройках<br>Poți schimba asta mai târziu din setări<br>You can change this later in settings</p>
    <div id="buttons">
      <button class="lang-btn press" data-lang="ru">
        <svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect width="30" height="13.33" y="0" fill="#fff"/><rect width="30" height="6.67" y="6.67" fill="#0039a6"/><rect width="30" height="6.67" y="13.33" fill="#d52b1e"/></svg>
        Русский
      </button>
      <button class="lang-btn press" data-lang="ro">
        <svg class="flag" viewBox="0 0 30 20"><rect width="10" height="20" x="0" fill="#002b7f"/><rect width="10" height="20" x="10" fill="#fcd116"/><rect width="10" height="20" x="20" fill="#ce1126"/></svg>
        Română
      </button>
      <button class="lang-btn press" data-lang="en">
        <svg class="flag" viewBox="0 0 30 20">
          <rect width="30" height="20" fill="#012169"/>
          <path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>
          <path d="M0,0 L30,20 M30,0 L0,20" stroke="#c8102e" stroke-width="2"/>
          <path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/>
          <path d="M15,0 V20 M0,10 H30" stroke="#c8102e" stroke-width="3.2"/>
        </svg>
        English
      </button>
    </div>
    <div id="spinner"></div>
  </div>

<script>
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

  function goToApp(lang){
    window.location.replace('/app/' + lang);
  }

  function showPicker(){
    document.getElementById('buttons').style.display = '';
    document.getElementById('spinner').style.display = 'none';
  }

  // Если язык уже сохранён для этого пользователя — сразу открываем приложение,
  // без показа экрана выбора (быстрый повторный вход).
  function checkSavedLanguage(){
    if(!tg || !tg.initData){ showPicker(); return; }
    document.getElementById('buttons').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';
    fetch('/api/get-language', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.ok && data.lang){ goToApp(data.lang); }
      else { showPicker(); }
    }).catch(function(){ showPicker(); });
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var lang = btn.dataset.lang;
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      if(tg && tg.initData){
        fetch('/api/set-language', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData, lang: lang })
        }).then(function(){ goToApp(lang); }).catch(function(){ goToApp(lang); });
      } else {
        goToApp(lang);
      }
    });
  });

  checkSavedLanguage();
</script>
</body>
</html>
